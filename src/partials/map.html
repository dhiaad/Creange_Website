<div class="map" data-map id="acces">
  <div class="map__frame" data-map-frame></div>
  <div class="map__gate">
    <p class="map__title">Afficher le plan d'accès</p>
    <p>La carte est fournie par Google Maps, un service tiers qui peut collecter des données sur votre navigation. Elle ne se charge qu'avec votre accord.</p>
    <div class="map__actions">
      <button class="btn" type="button" data-map-accept>Accepter et afficher la carte</button>
      {{> routes}}
    </div>
  </div>
</div>
