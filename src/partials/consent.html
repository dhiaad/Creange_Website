<div class="consent" role="dialog" aria-modal="false" aria-labelledby="consent-titre" data-consent hidden>
  <p class="consent__title" id="consent-titre">Vos choix sur ce site</p>
  <p>Ce site n'utilise ni publicité ni mesure d'audience. Seule la carte Google Maps, un service tiers, peut déposer des cookies : elle ne se charge qu'avec votre accord. Votre choix est conservé 6 mois. <a href="/politique-de-confidentialite/">En savoir plus</a></p>

    <label class="consent__row"><span>Fonctionnement du site</span><small>Mémorise vos choix et l'affichage. Toujours actif, aucun cookie tiers.</small><input type="checkbox" checked disabled></label>

  </div>
  <div class="consent__actions">
    <button class="btn" type="button" data-consent-refuse>Tout refuser</button>
    <button class="btn" type="button" data-consent-custom>Personnaliser</button>
    <button class="btn" type="button" data-consent-save hidden>Enregistrer</button>
    <button class="btn" type="button" data-consent-accept>Tout accepter</button>
  </div>
</div>
